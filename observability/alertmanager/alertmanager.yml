route:
  receiver: default
  routes:
    - receiver: sns-page
      matchers:
        - severity = "page"
    - receiver: sns-ticket
      matchers:
        - severity = "ticket"
    - receiver: watchdog
      matchers:
        - heartbeat = "true"
      repeat_interval: 5m
receivers:
  - name: default
  - name: sns-page
    sns_configs:
    - send_resolved: true
      topic_arn: "arn:aws:sns:us-east-1:330866750121:watchfloor-AM_Page"
      sigv4:
        region: "us-east-1"
  - name: sns-ticket
    sns_configs:
    - send_resolved: true
      topic_arn: "arn:aws:sns:us-east-1:330866750121:watchfloor-AM_Ticket"
      sigv4:
        region: "us-east-1"
  - name: watchdog
    sns_configs:
      - send_resolved: false
        topic_arn: "arn:aws:sns:us-east-1:330866750121:watchfloor-watchdog"
        sigv4:
          region: "us-east-1"
