route:
  receiver: default
  routes:
    - receiver: sns-page
      matchers:
        - severity = "page"
    - receiver: sns-ticket
      matchers:
        - severity = "ticket"
receivers:
  - name: default
  - name: sns-page
    sns_configs:
    - send_resolved: true
      topic_arn: "arn:aws:sns:us-east-1:330866750121:watchfloor-AM_Page"
      sigv4:
        region: "us-east-1"
  - name: sns-ticket
    sns_configs:
    - send_resolved: true
      topic_arn: "arn:aws:sns:us-east-1:330866750121:watchfloor-AM_Ticket"
      sigv4:
        region: "us-east-1"
