route:
  receiver: default
  routes:
    - receiver: sns-page
      matchers:
        - severity = "page"
    - receiver: sns-ticket
      matchers:
        - severity = "ticket"
receivers:
  - name: default
  - name: sns-page
  - name: sns-ticket

sns_configs:
  send_resolved: true
  sigv4:
    - region: 'us-east'1'
    - role_arn: fee

