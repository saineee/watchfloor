global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'watchfloor-api'
    dns_sd_configs:
      - names:
          - "api.watchfloor.local"
        type: "A"
        port: 8000
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [ 'alertmanager.watchfloor.local:9093' ]
