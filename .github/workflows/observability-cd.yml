name: Observability CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'observability/**'
      - '.github/workflows/observability-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo 'services=["prometheus", "grafana", "alertmanager"]' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if grep -q '^.github/workflows/observability-cd.yml$' <<< "$changed"; then
              echo 'services=["prometheus", "grafana", "alertmanager"]' >> "$GITHUB_OUTPUT"
            else
              list=()
              for svc in prometheus grafana alertmanager; do
                grep -q "^observability/$svc/" <<< "$changed" && list+=("$svc")
              done
              json_array=$(jq -cn '$ARGS.positional' --args "${list[@]}")
              echo "services=$json_array" >> "$GITHUB_OUTPUT"
            fi
          fi
        id: services
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
  push:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OBS_DEPLOY_ROLE }}
          aws-region: 'us-east-1'
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build, Tag, Push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: watchfloor-obs-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "observability/$SERVICE"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
