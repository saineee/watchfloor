name: Backend CD Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: 'watchfloor-api'
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: 'us-east-1'
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
             echo "exists=true" >> "$GITHUB_OUTPUT"
          else
             echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        id: check
        name: Check if current tag already exists
      - name: Build, tag, and push to ECR
        if: steps.check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" backend/
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
      - run: aws ecs describe-task-definition --task-definition watchfloor-api --query taskDefinition --output json > task-definition.json
        name: describe
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: 'watchfloor-api'
          image: ${{ steps.check.outputs.image }}
      - run: |
          # shellcheck disable=SC2016
          # backticks are there for literal comma character
          echo "subnets=$(aws ecs describe-services --cluster watchfloor-cluster --services watchfloor-service \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets|join(`,`,@)' --output text)">> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          echo "sgroups=$(aws ecs describe-services --cluster watchfloor-cluster --services watchfloor-service \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups|join(`,`,@)' --output text)" >> "$GITHUB_OUTPUT"
        id: vpc
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: 'watchfloor-cluster'
          service: 'watchfloor-service'
          wait-for-service-stability: true
          run-task: true
          wait-for-task-stopped: true
          run-task-subnets: ${{ steps.vpc.outputs.subnets }}
          run-task-security-groups: ${{ steps.vpc.outputs.sgroups }}
          run-task-container-overrides: '[ { "name": "watchfloor-api", "command": [ "alembic", "upgrade", "head" ] } ]'
