name: Backend CI Pipeline

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  test:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: watchfloordb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall . -q
      - run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/watchfloordb_test
          ANTHROPIC_API_KEY: ahdsjfh123129831239
          COOKIE_SECURE: false
