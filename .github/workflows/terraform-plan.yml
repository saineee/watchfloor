name: Terraform Plan Pipeline

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
jobs:
  tf-plan:
    env:
      TF_VAR_anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      TF_VAR_anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      TF_VAR_anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      TF_VAR_anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE }}
          aws-region: 'us-east-1'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform format
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false 2>&1 | tee plan.txt

      - name: markdown file
        if: ${{ !cancelled() }}
        run: |
          { echo '<details><summary>Terraform Plan</summary>'; echo; echo '```terraform'; head -c 60000 plan.txt || echo 'plan did not run, see earlier steps'; echo '```'; echo '</details>'; } > body.md

      - name: github pull request comment
        if: ${{ !cancelled() }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file ./body.md \
            --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
