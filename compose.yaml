services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=watchfloordb
    ports: [ "5433:5432" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: pg_isready
      interval: 15s
      retries: 3
      start_period: 10s
      timeout: 10s
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=http://localhost:9090"
    ports: [ "9090:9090" ]
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - "prometheus.watchfloor.local"
  grafana:
    image: grafana/grafana:13.2.2
    ports: [ "3000:3000" ]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      default:
        aliases:
          - "grafana.watchfloor.local"
  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports: [ "9093:9093" ]
    environment:
      - AWS_PROFILE=alertmanager
      - AWS_REGION=us-east-1
      - AWS_CONFIG_FILE=/home/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/home/.aws/credentials
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${HOME}/.aws/credentials:/home/.aws/credentials:ro
      - ${HOME}/.aws/config:/home/.aws/config:ro
    networks:
      default:
        aliases:
          - "alertmanager.watchfloor.local"
  api:
    build: ./backend
    ports: [ "8000:8000" ]
    env_file: "./backend/.env"
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@db:5432/watchfloordb
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - "api.watchfloor.local"
volumes:
  postgres_data:
  prometheus_data:
